# Publish to PyPI with trusted publishing (OIDC): no API token is stored.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> PyPI (tag must equal the version)
#   Actions -> publish -> Run workflow            -> TestPyPI (default) or PyPI
#
# One-time setup, on pypi.org and test.pypi.org: "Publishing" -> add a pending
# publisher: owner hadilq, repository torch-type-nn, workflow publish.yml,
# environment pypi (resp. testpypi). Then create the two environments under
# the repository's Settings -> Environments.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version v$v"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    # the test-suite against the built wheel, from the sdist's own tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install CPU torch and the wheel
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest dist/*.whl
      - name: Run the tests from the sdist
        run: |
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist && rm -rf src          # import the installed wheel, not the sources
          python -m pytest -q -p no:cacheprovider

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
    permissions:
      id-token: write          # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
