[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torch-type-nn"
version = "0.1.0.dev0"
description = "type-nn for PyTorch: networks of partition functions (And of Ors) that grow and prune their own width, degree and depth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "torch-type-nn contributors" }]
keywords = ["pytorch", "neural-network", "partition-function", "structure-learning", "pruning", "type-theory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/hadilq/torch-type-nn"
Repository = "https://github.com/hadilq/torch-type-nn"
Issues = "https://github.com/hadilq/torch-type-nn/issues"
Board = "https://github.com/hadilq/torch-type-nn/blob/main/BOARD.md"
"C reference" = "https://github.com/hadilq/type-nn"
"Design notes" = "https://hadilq.com/posts/train-the-knowledge/"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_type_nn"]

# C sources are package data at src/torch_type_nn/native/c (tnn_py.c + type-nn).
# Do not force-include that directory from csrc/ as well: hatchling then adds
# ORIGIN twice and `nix flake check` / `python -m build` fail with
# "A second file is being added to the wheel archive at the same path".

# The sdist carries what the test-suite needs (tests import benchmarks/*.py);
# the datasets are not in it (git-ignored; fetch with benchmarks/fetch_data.py).
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "docs", "README.md", "BOARD.md", "LICENSE",
           "pyproject.toml", "flake.nix", "flake.lock"]
exclude = ["benchmarks/data/*", "!benchmarks/data/README.md", "benchmarks/results/pre-audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]
